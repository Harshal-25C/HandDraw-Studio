<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harsh Diary — Air Canvas</title>
  <meta name="description" content="Draw in the air with your hand using MediaPipe hand tracking." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Hidden video feed for MediaPipe -->
  <video id="vid" playsinline></video>

  <!-- Main drawing canvas -->
  <canvas id="canvas"></canvas>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-title">Harsh Tech Diary</div>
    <div class="loading-sub">Awakening the canvas…</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <!-- Status badge (top-center) -->
  <div id="status">Initialising…</div>

  <!-- Hint text -->
  <div id="hint">Pinch your thumb &amp; index finger together to draw</div>

  <!-- Mode tag (top-right) -->
  <div id="modeTag">Gold</div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Toolbar (bottom-center) -->
  <div id="toolbar"></div>

  <!-- Scripts (order matters) -->
  <script src="js/events.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
